name: otehon app

# Otehon path (ADR 0026 D18): the ClojureScript build and tests of the Tauri
# app in app/. It is not a Native gate, build, packaging or runtime path, and
# it is not a required check.

on:
  pull_request:
    paths:
      - "app/**"
      - "otehon/src/**"
      - "itonami/profiles/**"
      - ".github/workflows/otehon-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  otehon-app:
    name: otehon-app (cljs build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Clojure CLI (pinned)
        working-directory: .
        run: |
          set -eu
          curl -fsSLo /tmp/clj-install.sh https://github.com/clojure/brew-install/releases/download/1.12.5.1654/linux-install.sh
          chmod +x /tmp/clj-install.sh
          sudo /tmp/clj-install.sh
      - run: npm ci
      - run: npm test
      - run: npm run build
