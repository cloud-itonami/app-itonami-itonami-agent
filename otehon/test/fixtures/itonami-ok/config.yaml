# itonami profile: inference rides itonami.edn :inference (murakumo only).
model:
  provider: murakumo
  base_url: https://api.murakumo.cloud/v1
  default: mishima
  max_tokens: 8192
providers:
  murakumo:
    base_url: https://api.murakumo.cloud/v1
