<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Itonami</title>
  <link rel="stylesheet" href="kotoba-client-consent.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="agent-client.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <header id="topbar" class="topbar"></header>
    <aside id="sidebar" class="sidebar" aria-label="Sessions and bots"></aside>
    <div id="scrim" class="scrim" aria-hidden="true"></div>
    <main class="main">
      <div id="content" class="content"></div>
      <div id="notice" class="notice-slot"></div>
      <form id="composer" class="composer" autocomplete="off">
        <label class="visually-hidden" for="composer-input">Message</label>
        <textarea id="composer-input" rows="2" maxlength="8192" placeholder="Message the bot. Enter sends, Shift+Enter adds a line."></textarea>
        <button id="composer-send" class="btn primary" type="submit" disabled>Send</button>
      </form>
    </main>
    <footer id="statusbar" class="statusbar"></footer>
  </div>
</body>
</html>
